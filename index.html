<!doctype html>
<html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Лерин квест</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&display=swap">
<style>
/* Arcade cabinet: one 3:4 pixel screen, HUD above, control deck below, letter unfolds under it at the end */
:root{
  --bg:#1d1024; --panel:#2c1835; --ink:#fbe9d0; --muted:#c9a9b8;
  --ginger:#ff8a3d; --pink:#ff6fa3; --mint:#7fe0c0; --line:#4a2a55; --shadow:#7a3a12;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"PT Mono","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
#app{width:min(100%,max(270px,calc((100dvh - 210px)*.75)));margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:10px;letter-spacing:.06em}
#status{color:var(--pink)}
#task{margin:0;min-height:3em;font-size:14px;color:var(--muted);text-wrap:balance}
.prog{height:8px;background:var(--line);margin-top:6px}
.prog i{display:block;height:100%;background:var(--ginger);width:0}
.stage{position:relative;width:100%;aspect-ratio:3/4;max-width:100%;border:4px solid var(--line);background:#000;box-sizing:border-box;overflow:hidden}
#street{position:absolute;top:0;left:-65.56%;width:231.2%;height:100%;max-width:none;filter:saturate(1.15)}
canvas#cv{position:relative;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#bigtitle{position:absolute;left:0;right:0;top:0;padding:14px 10px;margin:0;background:linear-gradient(rgba(20,10,26,.9) 70%,rgba(20,10,26,0));text-align:center;font-family:var(--display);font-size:clamp(14px,5vw,22px);line-height:1.5;color:var(--ink);
  text-shadow:3px 3px 0 var(--pink),-1px -1px 0 #000;pointer-events:none;text-wrap:balance}
#bigtitle small{display:block;font-size:9px;margin-top:10px;text-shadow:2px 2px 0 #000;color:var(--ink)}
.toast{position:absolute;left:8px;right:8px;bottom:10px;background:var(--ink);color:var(--bg);font-family:var(--body);font-size:14px;padding:8px 10px;border:3px solid var(--bg);text-align:center;pointer-events:none}
.deck{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.deck.one{grid-template-columns:1fr}
button.px{font-family:var(--display);font-size:10px;line-height:1.4;color:var(--bg);background:var(--ginger);border:0;padding:12px 8px;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 4px 0 var(--shadow);cursor:pointer;margin-bottom:4px}
button.px:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 1px 0 var(--shadow)}
button.px:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
button.px.ok{background:var(--mint);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),0 4px 0 #2f7f6a}
button.px.big{font-size:18px;padding:14px}
.chip{font-family:var(--display);font-size:9px;line-height:1.5;padding:10px 8px;border:3px dashed var(--line);color:var(--muted);text-align:center}
.chip.ok{border-style:solid;border-color:var(--mint);color:var(--mint)}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,8,26,.92);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 #000;padding:16px;max-height:100%;width:100%;max-width:420px;box-sizing:border-box;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card .kicker{margin:0;font-family:var(--display);font-size:8px;color:var(--mint);letter-spacing:.08em}
.card h2{margin:0;font-family:var(--display);font-size:12px;line-height:1.6;color:var(--ginger);text-wrap:balance}
.card>*{flex-shrink:0}
.card .wish{margin:0;font-size:16px;line-height:1.45;color:#fff;min-height:1.5em}
.card canvas.ph{width:100%;max-width:190px;align-self:center;image-rendering:pixelated;background:#fff;border:6px solid #fff;border-bottom-width:22px;box-shadow:3px 3px 0 #000;transform:rotate(-2deg)}
.card textarea{font-family:var(--body);font-size:16px;background:var(--bg);color:var(--ink);border:3px solid var(--line);padding:8px;resize:none;width:100%;box-sizing:border-box}
#letter{display:flex;flex-direction:column;gap:14px;padding-block:8px 30px}
#letter h3{margin:0;font-family:var(--display);font-size:11px;color:var(--ginger);letter-spacing:.06em}
#letter p{margin:0}
#letter ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){button.px:active{transform:none}}
</style>

</head><body>
<div id="app">
  <div class="hud"><span id="lvl">ЛЕРИН КВЕСТ</span><span id="status"></span></div>
  <div id="taskwrap"><p id="task"></p><div class="prog" id="prog" hidden><i></i></div></div>
  <div class="stage" id="stage">
    <img id="street" src="img/street.jpg" alt="" hidden>
    <canvas id="cv"></canvas>
    <h1 id="bigtitle" hidden></h1>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="ov" hidden><div class="card" id="card" role="dialog" aria-live="polite"></div></div>
  </div>
  <div class="deck" id="deck"></div>
  <section id="letter" hidden>
    <h3>ПОЖЕЛАНИЯ</h3>
    <ol id="wishlist"></ol>
    <p id="finaltext"></p>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const W=180,H=240;
const cv=$('#cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const WISHES=[
  'Пусть дома всегда ждёт кто-то тёплый и рыжий, а вокруг будет много нежности, мурчания и людей, которые очень тебя любят.',
  'Пусть в этом году будет столько счастливых кадров, что не хватит памяти в телефоне. И вкусная еда в каждом из них.',
  'Пусть все дороги ведут туда, где тебя ждут, ракеты и пожары обходят стороной, а путешествия случаются почаще и уводят далеко за пределы Комиссаржевской.',
  'Пусть всё лишнее вылетает из твоей жизни так же быстро и далеко. Ты заслуживаешь только тех, кто тебя ценит.',
  'Всех победим! А рядом обязательно окажется человек, который будет лучшим для тебя: смотрит как Лео, любит как кот и никогда не машет красными флагами.'
];
const FINAL='Оставайся такой же смелой, красивой и настоящей. Пусть год будет лёгким, как безе, ярким, как твои волосы на солнце, и вкусным, как всё, что ты фотографируешь. С днём рождения!';

/* ---------- pixel helpers ---------- */
function R(x,y,w,h,c,g=ctx){g.fillStyle=c;g.fillRect(x,y,w,h);}
function shapes(g,list,outline){
  if(outline){g.fillStyle=outline;for(const s of list)g.fillRect(s[0]-1,s[1]-1,s[2]+2,s[3]+2);}
  for(const s of list){g.fillStyle=s[4];g.fillRect(s[0],s[1],s[2],s[3]);}
}
function heart(g,x,y,c='#ff6fa3',s=1){
  x=Math.round(x);y=Math.round(y);
  [[1,0,1],[3,0,1],[0,1,5],[1,2,3],[2,3,1]].forEach(([dx,dy,w])=>R(x+dx*s,y+dy*s,w*s,s,c,g));
}
function makeSprite(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g);return c;}
function stars(g,w,h,t,n=14){for(let i=0;i<n;i++){const x=(i*53)%w,y=(i*37)%h;R(x,y,1,1,Math.sin(t*3+i)>0?'#fff':'#7d6a9a',g);}}

const K='#1a0c16',OL='#120a14';
function drawCat(g,x,y,s,o){
  g.save();g.translate(Math.round(x),Math.round(y-(o.jump||0)));g.scale(s,s);
  /* fluffy ginger with a white bib and muzzle, yellow-green eyes (from her photo) */
  const hy=o.headDown?3:0,O='#e8893a',L='#f6ad62',D='#c0662a',C='#fbf6ee',P='#f2a0a8',G='#c9c95a';
  const tail=[];
  for(let i=0;i<8;i++){const tx=Math.round(1-i*.8+Math.sin(o.t*4+i*.5)*(i*.3));tail.push([tx-1,-5-i,3,2,i>5?L:O]);}
  shapes(g,[...tail,[2,-12,16,11,O],[4,-14,12,2,O],[1,-9,1,6,O],[3,-3,3,3,O],[12,-3,3,3,C],[16,-3,3,3,C],
    [11,-24+hy,14,10,O],[10,-19+hy,1,4,O],[25,-19+hy,1,4,O],
    [12,-26+hy,3,2,O],[21,-26+hy,3,2,O],[12,-28+hy,2,2,O],[22,-28+hy,2,2,O]],K);
  shapes(g,[[5,-13,8,1,L],[3,-10,1,4,L],[6,-7,6,1,D],[4,-5,5,1,D],[16,-24+hy,1,2,D],[19,-24+hy,1,2,D],
    [13,-25+hy,1,1,P],[22,-25+hy,1,1,P],[12,-28+hy,1,1,L],[23,-28+hy,1,1,L],
    [14,-14,8,13,C],[10,-17+hy,2,2,C],[24,-17+hy,2,2,C],[14,-18+hy,9,4,C],[17,-22+hy,2,4,C],
    [3,-1,3,1,L],[17,-18+hy,2,1,P],[25,-17+hy,2,1,'#fff'],[25,-19+hy,2,1,'#fff']]);
  if(o.happy)shapes(g,[[14,-21+hy,1,1,K],[15,-22+hy,1,1,K],[16,-21+hy,1,1,K],[20,-21+hy,1,1,K],[21,-22+hy,1,1,K],[22,-21+hy,1,1,K]]);
  else if(o.blink)shapes(g,[[14,-21+hy,2,1,K],[20,-21+hy,2,1,K]]);
  else shapes(g,[[14,-22+hy,2,2,G],[20,-22+hy,2,2,G],[15,-22+hy,1,2,K],[21,-22+hy,1,2,K]]);
  if(o.mouth)R(17,-16+hy,2,1,K,g);
  g.restore();
}

/* ---------- people (drawn from the photos) ---------- */
const LERA={hair:'#f4eed6',hs:'#fffbea',style:'bob',skin:'#f8dccc',top:'#16141c',pants:'#55555f',shoes:'#141018',lips:'#b0182a',ring:true,belt:true};
const P={
  lera:LERA,
  leraRun:{...LERA,collar:true},
  leraFun:{hair:'#2a1a14',hs:'#4a3228',style:'curly',skin:'#f3cdb8',top:'#5a78a8',plaid:'#a8c4ea',inner:'#16141c',pants:'#1a181e',wide:true,shoes:'#f4f4f4',smile:true,ring:true,phone:true},
  b1:{hair:'#3a2418',hs:'#5a3a2a',style:'curly',skin:'#efc6ad',top:'#1c1a22',inner:'#f6dede',zip:true,pants:'#1c1a22',shoes:'#1c1a22',glasses:'#0c0a10'},
  b2:{hair:'#e8202e',hs:'#ff5a64',style:'bob',skin:'#f3cdb8',top:'#1a181e',print:'metal',short:true,legs:true,pants:'#1a181e',shoes:'#1a181e',glasses:'#3a0f14',lips:'#9a4050'},
  b3:{hair:'#2e1d16',hs:'#4a3228',style:'bob',skin:'#f3cdb8',top:'#9aa08e',pants:'#2a2a30',shoes:'#ddd',glasses:'#e6e8ee'},
  n1:{hair:'#141016',hs:'#3a3040',style:'long',bangs:true,skin:'#f0c4a8',top:'#141016',tank:true,pants:'#4a6a9a',shoes:'#eee',lips:'#c06a6a'},
  n2:{hair:'#2a1a14',hs:'#4a3228',style:'pony',skin:'#f0c4a8',top:'#f4f2ee',print:'bear',short:true,pants:'#1c1a22',shoes:'#eee',lips:'#c06a6a',wink:true},
  k1:{hair:'#5a2e1e',hs:'#7a4430',style:'pixie',skin:'#f6d6c6',top:'#4a4a4e',pants:'#2a2a30',shoes:'#111',lips:'#8a3a3a',shadow:'#b8c830',beer:true},
  k2:{hair:'#b08a64',hs:'#d0aa80',style:'long',skin:'#f6d6c6',top:'#1c1c22',inner:'#f4f4f4',strap:'#5a7a4a',pants:'#2a2a30',shoes:'#111',ring:true,beer:true}
};
P.me={...P.k2,beer:false};
P.leo={hair:'#9a6a3a',hs:'#e0b070',style:'curtain',skin:'#f4cdb4',top:'#121216',bow:true,pants:'#121216',shoes:'#000',eye:'#6aaee8',lips:'#d08080',money:true};
P.ex={hair:'#e6b896',hs:'#e6b896',style:'bald',wrap:'#eef0f4',cap:'#80848e',skin:'#e6b896',top:'#3e4652',hood:true,pants:'#1c1c22',shoes:'#eeeeee',lips:'#a86a5a',noBlush:true};
function drawPerson(g,x,y,s,p,o={}){
  g.save();g.translate(Math.round(x),Math.round(y));g.scale(s,s);
  const st=o.step||0,S=p.skin,T=p.top,up=o.armsUp,b=[];
  if(p.legs)b.push([-4,-13,3,4,p.pants],[1,-13,3,4,p.pants],[-4,-9,3,st>0?6:7,S],[1,-9,3,st<0?6:7,S]);
  else if(p.wide)b.push([-6,-13,5,st>0?10:11,p.pants],[1,-13,5,st<0?10:11,p.pants]);
  else b.push([-4,-13,3,st>0?10:11,p.pants],[1,-13,3,st<0?10:11,p.pants]);
  b.push([-5,st>0?-4:-2,4,2,p.shoes],[1,st<0?-4:-2,4,2,p.shoes]);
  const AU=[[-9,-25],[-10,-28],[-11,-31],[7,-25],[8,-28],[9,-31]];
  if(up)AU.forEach(([ax,ay])=>b.push([ax,ay,2,3,T]));else b.push([-8,-22,2,9,T],[6,-22,2,9,T]);
  b.push([-7,-23,14,10,T]);
  shapes(g,b,OL);
  const d=[];
  if(p.tank){if(up)AU.forEach(([ax,ay])=>d.push([ax,ay,2,3,S]));else d.push([-8,-22,2,9,S],[6,-22,2,9,S]);d.push([-7,-23,3,2,S],[4,-23,3,2,S]);}
  else if(p.short){if(up)[1,2,4,5].forEach(i=>d.push([AU[i][0],AU[i][1],2,3,S]));else d.push([-8,-17,2,4,S],[6,-17,2,4,S]);}
  d.push(...(up?[[-11,-32,2,1,S],[9,-32,2,1,S]]:[[-8,-13,2,1,S],[6,-13,2,1,S]]));
  if(p.plaid){for(let i=-6;i<7;i+=3)d.push([i,-23,1,10,p.plaid]);d.push([-7,-19,14,1,p.plaid],[-7,-16,14,1,p.plaid]);}
  if(p.inner)d.push([-2,-23,4,4,p.inner]);
  if(p.zip)d.push([0,-19,1,6,'#6a6670']);
  if(p.hood)d.push([-6,-24,12,2,'#323944'],[-4,-18,8,4,'#353c46'],[-2,-22,1,3,'#e8e8e8'],[1,-22,1,3,'#e8e8e8'],[-7,-14,14,1,'#f4f4f4']);
  if(p.collar)d.push([-6,-23,4,9,'#a5805e'],[2,-23,4,9,'#a5805e'],[-5,-22,1,6,'#cfab83'],[4,-21,1,6,'#cfab83']);
  if(p.print==='metal')d.push([-4,-20,8,1,'#eee'],[-3,-21,1,1,'#eee'],[3,-19,1,1,'#eee']);
  if(p.print==='bear')d.push([-3,-21,6,2,'#ff6fa3'],[-3,-18,2,2,'#9a7ad8'],[1,-18,2,2,'#ff8fb1'],[-5,-22,1,1,'#ffd65a'],[4,-19,1,1,'#ffd65a']);
  if(p.strap)for(let i=0;i<10;i++)d.push([-6+i,-23+i,1,1,p.strap]);
  if(p.belt)d.push([-4,-14,8,1,'#000'],[-1,-14,2,1,'#c9ccd6']);
  if(p.bow)d.push([-2,-23,4,8,'#f4f4f4'],[-2,-22,4,1,'#111'],[-3,-23,1,6,'#2a2a30'],[2,-23,1,6,'#2a2a30']);
  if(p.money)d.push(...(up?[[-12,-36,4,3,'#5fbf4f'],[9,-36,4,3,'#5fbf4f'],[-12,-35,4,1,'#3a8a3a'],[9,-35,4,1,'#3a8a3a']]
    :[[-10,-16,4,3,'#5fbf4f'],[7,-16,4,3,'#5fbf4f'],[-10,-15,4,1,'#3a8a3a'],[7,-15,4,1,'#3a8a3a']]));
  d.push([-1,-24,2,1,S]);
  if(p.phone&&!up)d.push([-2,-18,4,3,'#4a3a5a'],[-4,-17,2,1,S],[2,-17,2,1,S]);
  if(p.beer)d.push(up?[9,-36,3,4,'#e8b64a']:[6,-17,3,4,'#e8b64a'],up?[9,-36,3,1,'#fff8e0']:[6,-17,3,1,'#fff8e0']);
  shapes(g,d);
  const hair={
    bob:[[-5,-33,10,2],[-6,-31,12,3],[-6,-28,2,4],[4,-28,2,4],[-7,-25,3,2],[4,-25,3,2],[-5,-31,6,2],[-5,-29,2,1]],
    curly:[[-6,-35,12,3],[-7,-33,14,4],[-8,-30,3,7],[5,-30,3,7],[-8,-24,2,2],[6,-24,2,2],[-4,-36,2,1],[1,-36,3,1],[-4,-31,3,1],[1,-31,3,1]],
    long:[[-5,-33,10,2],[-6,-31,12,3],[-6,-28,2,16],[4,-28,2,16]],
    pony:[[-5,-33,10,3],[-5,-30,1,3],[4,-30,1,3],[4,-35,3,3]],
    pixie:[[-5,-33,10,3],[-6,-31,12,2],[-6,-29,2,4],[4,-29,2,4],[-4,-30,8,1],[-3,-29,1,1],[1,-29,1,1]],
    floppy:[[-5,-33,10,2],[-6,-31,12,3],[-6,-28,2,4],[4,-28,2,4],[-4,-30,3,3],[1,-30,3,3]],
    curtain:[[-4,-35,9,1],[-5,-34,11,2],[-6,-32,12,2],[-5,-30,6,1],[-4,-29,3,1],[-5,-30,1,4],[4,-30,1,3]],
    bald:[[-5,-31,10,2],[-5,-29,1,3],[4,-29,1,3]]
  }[p.style].slice();
  if(p.bangs)hair.push([-4,-30,8,2]);
  const cap=p.cap?[[-4,-35,8,1,p.cap],[-5,-34,10,3,p.cap],[-5,-31,10,1,'#5c606a'],[5,-32,5,2,'#5c606a']]:[];
  shapes(g,[[-4,-30,8,6,o.back?p.hair:S],...hair.map(r=>[...r,p.hair]),...cap],OL);
  const f=p.cap?[[-2,-34,4,1,'#a0a4ae'],[2,-33,2,1,'#c8ccd4']]:[[-3,-33,5,1,p.hs]];
  if(p.style==='curtain')f.push([-3,-34,6,1,p.hs],[0,-33,4,1,p.hs],[-4,-31,4,1,p.hs],[-3,-30,3,1,'#c08a50'],[3,-32,2,1,'#7a5028']);
  if(o.back)f.push([-5,-29,10,1,p.hs]);
  else{
    if(p.wrap)f.push([-5,-28,10,2,p.wrap],[-4,-28,3,1,'#3a4a6a'],[1,-28,3,1,'#3a4a6a'],[-4,-27,3,1,'#5a6a8a'],[1,-27,3,1,'#5a6a8a']);
    else if(p.glasses)f.push([-5,-28,4,2,p.glasses],[1,-28,4,2,p.glasses],[-1,-28,2,1,p.glasses],[-4,-28,1,1,'#ffffff80']);
    else{if(p.shadow)f.push([-4,-28,2,1,p.shadow],[1,-28,2,1,p.shadow]);const E=p.eye||OL;f.push([-3,-27,1,1,E],p.wink?[1,-27,2,1,E]:[1,-27,1,1,E]);}
    f.push(p.smile?[-2,-25,4,1,'#9a3a4a']:[-1,-25,2,1,p.lips||'#c87a7a']);
    if(!p.noBlush)f.push([-4,-26,1,1,'#f4a7a0'],[2,-26,1,1,'#f4a7a0']);
    if(p.ring)f.push([0,-26,1,1,'#d8dce6']);
  }
  shapes(g,f);
  g.restore();
}
const sprCache=new Map();
function personSpr(key,o={}){
  const id=key+JSON.stringify(o);let c=sprCache.get(id);
  if(!c){c=makeSprite(28,42,g=>drawPerson(g,14,40,1,P[key],o));sprCache.set(id,c);}
  return c;
}

/* ---------- sound ---------- */
let ac;
function beep(f=440,d=.08,type='square',v=.04,delay=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+delay,o=ac.createOscillator(),gn=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function jingle(notes,step=.11,type='square'){notes.forEach((n,i)=>n&&beep(n,step*.9,type,.04,i*step));}

function setDeck(html,one){$('#deck').innerHTML=html;$('#deck').classList.toggle('one',!!one);}
let toastT;
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
let typeT;
function typeText(el,text){
  clearInterval(typeT);
  if(REDUCED){el.textContent=text;return;}
  let i=0;el.textContent='';
  typeT=setInterval(()=>{el.textContent=text.slice(0,++i);if(i%4===0)beep(880,.02,'square',.015);if(i>=text.length)clearInterval(typeT);},24);
}
/* paint(g,t) draws an animated pixel picture on a 160x112 polaroid */
function card({kicker='',title,text='',paint,html='',btn='Дальше',onNext}){
  const ov=$('#ov'),c=$('#card');
  c.innerHTML=(kicker?`<p class="kicker">${kicker}</p>`:'')+`<h2>${title}</h2>`+(paint?'<canvas class="ph"></canvas>':'')+`<p class="wish"></p>${html}<button class="px" id="card-btn">${btn}</button>`;
  ov.hidden=false;
  const ph=c.querySelector('canvas.ph');
  if(ph){
    ph.width=160;ph.height=112;const g=ph.getContext('2d'),t0=performance.now();
    const tick=now=>{if(!ph.isConnected||ov.hidden)return;g.imageSmoothingEnabled=false;g.clearRect(0,0,160,112);paint(g,REDUCED?0:(now-t0)/1000);requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  }
  typeText(c.querySelector('.wish'),text);
  const b=$('#card-btn');
  b.onclick=()=>{beep(660,.06);ov.hidden=true;onNext&&onNext();};
  if(!c.querySelector('textarea'))b.focus({preventScroll:true});
}

function addP(list,p){list.push(Object.assign({vx:0,vy:-20,life:1.2,age:0,type:'heart',c:'#ff6fa3'},p));}
function stepP(list,dt){for(const p of list){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.type==='confetti')p.vy+=30*dt;}return list.filter(p=>p.age<p.life);}
function drawP(list){for(const p of list){
  if(p.type==='heart')heart(ctx,p.x,p.y,p.c);
  else if(p.type==='confetti')R(Math.round(p.x),Math.round(p.y),2,(p.age*8|0)%2?1:2,p.c);
  else R(Math.round(p.x),Math.round(p.y),1,1,p.c);
}}

const exScene={
  enter(){
    Object.assign(this,{t:0,hits:0,ex:{x:130,dir:1,pause:0},poops:[],splats:[],floor:[],phase:'throw',lx:28,fly:null,bonk:0,parts:[]});
    hud('УРОВЕНЬ 4/5','💩 0/5');
    task('В баре объявился бывший. Жми на него, чтобы кинуть какашку. Нужно 5 попаданий.');
    setDeck('<button class="px" data-a="throw">Кинуть какашку</button>',true);
    card({kicker:'УРОВЕНЬ 4',title:'Бывший',text:'Пришёл без приглашения и делает вид, что так и надо. Целься с запасом: он уворачивается.',btn:'Взять снаряд'});
  },
  throwAt(tx,ty){
    if(this.phase!=='throw'||this.poops.length>2||!$('#ov').hidden)return;
    this.poops.push({sx:this.lx+8,sy:150,tx,ty,p:0});beep(300,.06,'triangle');
  },
  onPointer(type,x,y){if(type==='down')this.throwAt(x,y);},
  onDeck(a){
    if(a==='throw')this.throwAt(this.ex.x,150);
    if(a==='walk'&&this.phase==='ready'){this.phase='walk';setDeck('<button class="px" disabled>Идём…</button>',true);}
    if(a==='bonk'&&this.phase==='close'){this.phase='bonk';this.bonk=1;jingle([200,150,600,900],.08);
      this.fly={x:this.ex.x,y:196,vx:150,vy:-170,r:0};
      for(let i=0;i<14;i++)addP(this.parts,{type:'confetti',x:this.ex.x,y:150,vx:(Math.random()-.5)*120,vy:-60-Math.random()*60,life:1,c:i%2?'#ffd65a':'#fff'});
      setTimeout(()=>{jingle(HB.slice(0,6),.14,'triangle');card({kicker:'УРОВЕНЬ 4 ПРОЙДЕН',title:'Пожелание №4',text:WISHES[3],btn:'Дальше',onNext:()=>setScene(leoScene),
        paint:(g,tt)=>{R(0,0,160,112,'#9ad0f0',g);R(0,96,160,16,'#7ab060',g);
          drawPer(g,'leraRun',80,104-Math.round(Math.abs(Math.sin(tt*5))*6),2,{armsUp:Math.sin(tt*10)>0});
          const fx=(tt*40)%200-20;g.save();g.translate(130+fx/4,30-fx/6);g.rotate(tt*6);drawPer(g,'ex',0,10,.6);g.restore();}});},1600);
    }
  },
  update(dt){
    this.t+=dt;this.bonk=Math.max(0,this.bonk-dt*1.5);
    const e=this.ex;
    if(this.phase==='throw'){
      if(e.pause>0)e.pause-=dt;else{e.x+=e.dir*24*dt;if(e.x>165||e.x<95){e.dir*=-1;e.x=Math.max(95,Math.min(165,e.x));}if(Math.random()<dt*.5)e.pause=.7;}
    }
    for(const p of this.poops){
      p.p+=dt/.6;
      if(p.p>=1){p.done=true;
        if(Math.abs(p.tx-e.x)<15&&p.ty>118&&p.ty<200&&this.phase==='throw'){
          this.hits++;this.splats.push({dx:p.tx-e.x,dy:p.ty-196});beep(90,.15,'sawtooth',.05);toast(EX_LINES[(this.hits-1)%5],900);
          $('#status').textContent='💩 '+this.hits+'/5';
          if(this.hits>=5){this.phase='ready';task('Пять из пяти! Теперь подойди и врежь ему сумочкой.');setDeck('<button class="px" data-a="walk">Подойти</button>',true);}
        }else this.floor.push({x:p.tx,y:Math.max(160,Math.min(232,p.ty+30))});
      }
    }
    this.poops=this.poops.filter(p=>!p.done);
    if(this.phase==='walk'){this.lx+=50*dt;if(this.lx>=e.x-24){this.lx=e.x-24;this.phase='close';setDeck('<button class="px big" data-a="bonk">БАЦ СУМОЧКОЙ!</button>',true);}}
    if(this.fly){const f=this.fly;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=120*dt;f.r+=8*dt;}
    this.parts=stepP(this.parts,dt);
  },
  draw(){
    const t=this.t,e=this.ex;
    drawPub(t);
    for(const s of this.floor)drawPoop(s.x,s.y);
    if(this.fly){const f=this.fly;ctx.save();ctx.translate(f.x,f.y-30);ctx.rotate(f.r);drawPer(ctx,'ex',0,30,2);ctx.restore();}
    else{
      const walking=this.phase==='throw'&&e.pause<=0;
      drawPer(ctx,'ex',e.x,196,2,{step:walking?(Math.floor(t*6)%2?1:-1):0});
      for(const s of this.splats){const x=Math.round(e.x+s.dx),y=Math.round(196+s.dy);R(x-3,y-1,6,3,'#7a4a24');R(x-1,y-3,3,2,'#8a5a2a');}
      if(this.phase!=='throw')R(e.x+12,150+Math.round(Math.sin(t*20)),2,4,'#5ac8fa');
    }
    const walking=this.phase==='walk';
    drawPer(ctx,'leraRun',this.lx,200,2,{step:walking?(Math.floor(t*8)%2?1:-1):0,armsUp:this.phase==='bonk'&&this.bonk>.5});
    const bx=Math.round(this.lx+14),by=this.phase==='bonk'&&this.bonk>.5?126:166;
    shapes(ctx,[[bx,by,10,8,'#ff6fa3']],K);R(bx+2,by-3,6,1,'#c94f7c');R(bx+2,by-3,1,3,'#c94f7c');R(bx+7,by-3,1,3,'#c94f7c');
    if(this.bonk>0){const s=Math.round(10+(1-this.bonk)*10),cx=e.x,cy=140;ctx.fillStyle='#ffd65a';
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2+t;ctx.fillRect(Math.round(cx+Math.cos(a)*s)-2,Math.round(cy+Math.sin(a)*s)-2,4,4);}
      pixText(ctx,'БАЦ',cx-7,cy-2,'#e8432a');}
    for(const p of this.poops){const x=p.sx+(p.tx-p.sx)*p.p,y=p.sy+(p.ty-p.sy)*p.p-Math.sin(p.p*Math.PI)*40;drawPoop(x,y);}
    drawP(this.parts);
  }
};

/* Level 5: run to Leo, jump the red flags */
const LEO_X=1120;
const leoScene={
  enter(){
    Object.assign(this,{t:0,dist:0,y:0,vy:0,slow:0,running:false,won:false,parts:[],
      flags:[240,430,610,790,960].map(x=>({x,hit:false}))});
    hud('УРОВЕНЬ 5/5','💛');
    task('В конце улицы ждёт Лео. Перепрыгивай красные флаги.');
    setDeck('<button class="px big" data-a="jump">ПРЫЖОК</button>',true);
    card({kicker:'УРОВЕНЬ 5',title:'Беги к Лео',text:'Там стоит Ди Каприо в смокинге и с охапкой денег. Красные флаги перепрыгивай: тап по экрану, пробел или кнопка.',btn:'Бегу!',onNext:()=>this.running=true});
  },
  jump(){if(this.running&&this.y===0){this.vy=175;beep(660,.06);}},
  onDeck(a){if(a==='jump')this.jump();},
  onKey(k){if(k===' '||k==='ArrowUp'||k==='w'||k==='ц')this.jump();},
  onPointer(type){if(type==='down')this.jump();},
  update(dt){
    this.t+=dt;
    if(this.running){
      this.slow=Math.max(0,this.slow-dt);
      this.dist+=(this.slow>0?40:85)*dt;
      this.y+=this.vy*dt;this.vy-=420*dt;if(this.y<=0){this.y=0;this.vy=0;}
      for(const f of this.flags){const d=f.x-this.dist;if(!f.hit&&d>-6&&d<6&&this.y<12){f.hit=true;this.slow=1;beep(110,.2,'sawtooth',.05);toast('Красный флаг! Не туда.',900);}}
      if(this.dist>=LEO_X-34){this.running=false;this.won=true;jingle([523,659,784,1047,1319],.12);
        for(let i=0;i<20;i++)addP(this.parts,{x:60+Math.random()*60,y:150,vx:(Math.random()-.5)*40,vy:-30-Math.random()*30,life:2});
        setTimeout(()=>card({kicker:'УРОВЕНЬ 5 ПРОЙДЕН',title:'Пожелание №5',text:WISHES[4],btn:'К финалу',onNext:()=>setScene(finalScene),
          paint:(g,tt)=>{R(0,0,160,112,'#ffb88a',g);R(0,96,160,16,'#3a2a40',g);heart(g,74,20+Math.round(Math.sin(tt*4)*2),'#e8432a',3);
            drawPer(g,'leraRun',58,104-Math.round(Math.abs(Math.sin(tt*5))*5),2,{armsUp:true});drawPer(g,'leo',104,104,2,{armsUp:Math.sin(tt*6)>0});
            for(let i=0;i<8;i++)R((i*23+tt*30|0)%160,(i*31+tt*50|0)%96,4,2,'#5fbf4f',g);}}),1300);}
      $('#status').textContent='💛 '+Math.max(0,Math.round(LEO_X-34-this.dist))+' м';
    }
    if(Math.random()<dt*4)addP(this.parts,{type:'confetti',x:40+(LEO_X-this.dist),y:120,vx:(Math.random()-.5)*30,vy:-40,life:1.5,c:'#5fbf4f'});
    this.parts=stepP(this.parts,dt);
  },
  draw(){
    const t=this.t,d=this.dist;
    ['#ff8a6a','#ff9e78','#ffb488','#ffc898','#ffdaa8'].forEach((c,i)=>R(0,i*30,W,30,c));
    R(120,96,22,22,'#fff3c4');R(118,100,26,14,'#fff3c4');
    for(let i=0;i<12;i++){const x=Math.round(((i*40-d*.3)%480+480)%480-40),h=40+(i*17)%40;R(x,200-h-30,30,h+30,'#7a3a5a');for(let w=0;w<3;w++)R(x+5+w*8,200-h-24,3,4,'#ffd68a');}
    R(0,200,W,40,'#3a2a40');for(let x=-(d%20);x<W;x+=20)R(Math.round(x),206,10,2,'#5a4a60');
    for(const f of this.flags){const x=Math.round(40+(f.x-d));if(x<-20||x>W+20)continue;
      R(x,180,2,20,'#e6e2ec');const w=Math.round(Math.sin(t*8+f.x)*1);R(x+2,180+w,10,7,'#e8432a');R(x+2,186+w,8,2,'#e8432a');}
    const lx=Math.round(40+(LEO_X-d));
    if(lx<W+30)drawPer(ctx,'leo',lx,200,2,{armsUp:this.won&&Math.sin(t*6)>0});
    const run=this.running&&this.y===0;
    drawPer(ctx,'leraRun',40,200-Math.round(this.y),2,{step:run?(Math.floor(t*10)%2?1:-1):0,armsUp:this.won});
    drawP(this.parts);
  }
};

/* ---------- loop & input ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(scene){scene.update(dt);ctx.imageSmoothingEnabled=false;scene.draw();}
  requestAnimationFrame(loop);
}
function toCanvas(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
['down','move','up'].forEach(ty=>cv.addEventListener('pointer'+ty,e=>{const[x,y]=toCanvas(e);scene&&scene.onPointer&&scene.onPointer(ty,x,y);}));
$('#deck').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&scene&&scene.onDeck)scene.onDeck(b.dataset.a);});
addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(scene&&scene.onKey&&$('#ov').hidden){scene.onKey(e.key);if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();}
});

buildSprites();setScene(titleScene);requestAnimationFrame(loop);
